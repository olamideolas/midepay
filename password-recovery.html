<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
 <title>Reset your password | MidePay Staging</title>
 <link rel="stylesheet" href="password-recovery.css">
 <script src="vendor/supabase.js" defer></script>
 <script src="api/config" defer></script>
 <script src="password-recovery.js" defer></script>
</head>
<body><main>
 <a href="/">← Back to MidePay</a><p class="badge">Staging account recovery</p>
 <h1>Set a new password</h1>
 <p>Verify a fresh email code first. Your transaction PIN will stay the same.</p>
 <form id="request-code">
  <label for="recovery-email">Your account email</label>
  <input id="recovery-email" type="email" autocomplete="email" maxlength="254" required>
  <button id="send-code" type="submit">Send verification code</button>
 </form>
 <form id="reset-password" hidden>
  <p>Use the newest six-digit code from your email. Keep the code and your password private.</p>
  <label for="recovery-code">Email verification code</label>
  <input id="recovery-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
  <label for="recovery-password">New password (at least 12 characters)</label>
  <input id="recovery-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
  <label for="recovery-confirm">Confirm new password</label>
  <input id="recovery-confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
  <button id="save-password" type="submit">Verify code and change password</button>
 </form>
 <p id="recovery-status" role="status" aria-live="polite"></p>
 <p id="recovery-done" hidden><a href="/">Return to MidePay and sign in with your new password</a></p>
</main></body></html>
