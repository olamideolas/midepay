<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 44" width="170" height="44" fill="none">
  <defs>
    <linearGradient id="mp-logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24C16E"/>
      <stop offset="50%" stop-color="#1EAA60"/>
      <stop offset="100%" stop-color="#137D45"/>
    </linearGradient>
    <linearGradient id="mp-logo-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#178046"/>
      <stop offset="100%" stop-color="#0F5A30"/>
    </linearGradient>
    <linearGradient id="mp-logo-coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5BD6B"/>
      <stop offset="60%" stop-color="#DEA253"/>
      <stop offset="100%" stop-color="#C58536"/>
    </linearGradient>
    <filter id="mp-logo-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon Mark (Square 40x40, left origin at 2,2) -->
  <g transform="translate(2, 2)">
    <!-- Main Body with Fold Cutout -->
    <path d="M 13 2 
             H 32 
             C 37 2, 38 4, 38 9 
             V 31 
             C 38 36, 37 38, 32 38 
             H 8 
             C 3 38, 2 36, 2 31 
             V 13 
             Z" 
          fill="url(#mp-logo-bg)"/>

    <!-- Folded Dog-Ear -->
    <path d="M 2 13 
             L 13 13 
             L 13 2 
             Z" 
          fill="url(#mp-logo-fold)" 
          filter="url(#mp-logo-shadow)"/>

    <!-- Coin / Gold Dot -->
    <circle cx="26" cy="23" r="5.5" fill="url(#mp-logo-coin)"/>
  </g>

  <!-- Wordmark: MidePay -->
  <text x="54" y="29" font-family="'Sora', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#F8FAFC">Mide</tspan><tspan fill="#22C55E">Pay</tspan>
  </text>
</svg>
