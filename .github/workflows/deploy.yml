name: MidePay Production CI/CD (Supabase + Vercel)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: midepay-production-deploy
  cancel-in-progress: false

jobs:
  ci-validation-gates:
    name: "Gate 1: Static, DOM, Runtime & Webhook Crypto Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Production Build Injection Check
        env:
          APP_ENV: production
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://pxdzdehocjnmxbuvipxu.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_5adXF0UhSQJ1n4F_IqLXEw_0naxL0wT' }}
        run: node build.js

      - name: Run Static Asset, Syntax & DOM Binding Gate
        run: node scripts/validate_production.js

      - name: Run Headless E2E Runtime & Security Gate
        run: node scripts/test_e2e_runtime.js

      - name: Run Edge Function TypeScript & HMAC Webhook Gate
        run: node scripts/test_payment_webhook.js

  deploy-supabase-backend:
    name: "Gate 2: Push SQL Migrations & Deploy Edge Functions"
    needs: ci-validation-gates
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'pxdzdehocjnmxbuvipxu' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Production Project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Configure Payment Gateway Secrets in Supabase Vault
        env:
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          FLUTTERWAVE_SECRET_KEY: ${{ secrets.FLUTTERWAVE_SECRET_KEY }}
          FLUTTERWAVE_WEBHOOK_HASH: ${{ secrets.FLUTTERWAVE_WEBHOOK_HASH }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'https://midepay.vercel.app' }}
        run: |
          supabase secrets set \
            PAYSTACK_SECRET_KEY="$PAYSTACK_SECRET_KEY" \
            FLUTTERWAVE_SECRET_KEY="$FLUTTERWAVE_SECRET_KEY" \
            FLUTTERWAVE_WEBHOOK_HASH="$FLUTTERWAVE_WEBHOOK_HASH" \
            ALLOWED_ORIGINS="$ALLOWED_ORIGINS" \
            --project-ref "$PROJECT_REF"

      - name: Push PostgreSQL Migrations (`supabase db push`)
        run: supabase db push

      - name: Deploy Authenticated Edge Functions (`init-payment`, `bank-payout`)
        run: |
          supabase functions deploy init-payment --project-ref "$PROJECT_REF"
          supabase functions deploy bank-payout --project-ref "$PROJECT_REF"

      - name: Deploy Public Signature-Verified Webhook (`payment-webhook --no-verify-jwt`)
        run: |
          supabase functions deploy payment-webhook --no-verify-jwt --project-ref "$PROJECT_REF"

  deploy-vercel-production:
    name: "Gate 3: Deploy Frontend to Vercel Production"
    needs: deploy-supabase-backend
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      APP_ENV: production
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://pxdzdehocjnmxbuvipxu.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate Production `config.js`
        run: node build.js

      - name: Install Vercel CLI & Deploy Production Bundle
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

